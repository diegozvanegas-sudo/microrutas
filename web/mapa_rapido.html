<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mapa</title>
    <link rel="stylesheet" href="css/leaflet.css">
    <style>
    :root { --brand: #167a55; --brand-dark: #0f6847; --ink: #1f2937; --muted: #64748b; --line: #dce4e8; --surface: #ffffff; --bg: #f3f6f5; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
    #barra { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 12px 6px; display: grid; gap: 6px; box-shadow: 0 2px 10px rgba(15, 45, 35, .08); z-index: 1001; }
    .fila { display: flex; gap: 6px; align-items: center; min-width: 0; }
    .fila input { flex: 1; min-width: 0; min-height: 38px; border: 1px solid #b8c6cd; border-radius: 9px; padding: 6px 10px; font: inherit; color: var(--ink); background: #fff; }
    button, .boton { font: inherit; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer; font-weight: 650; text-decoration: none; white-space: nowrap; display: inline-block; }
    .primario { color: #fff; background: var(--brand); }
    .primario:hover { background: var(--brand-dark); }
    .secundario { color: var(--brand); background: #edf8f3; }
    .chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; font-size: 13px; }
    .chip .punto { width: 10px; height: 10px; border-radius: 50%; }
    .chip[aria-pressed="true"] { border-color: var(--brand); background: #e3f4ec; box-shadow: inset 0 0 0 1px var(--brand); }
    .chip.cargando { opacity: .6; }
    .chip.capa { border-style: dashed; color: var(--muted); }
    .chip.capa[aria-pressed="true"] { border-style: solid; color: var(--ink); }
    .separador { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
    #estado { font-size: 12px; color: var(--muted); min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #map { flex: 1; min-height: 0; }
    .leaflet-bar a { color: var(--ink); }
    .ubicar a, .herramientas a { font-size: 17px; line-height: 30px; text-align: center; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.35; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 3px 0; vertical-align: top; }
    .parada-num { background: var(--brand); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 28px !important; height: 28px !important; margin: -14px 0 0 -14px !important;
                  display: grid; place-items: center; font-weight: 700; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
    /* Pre-ruta: revisados en verde, pendientes en rojo, cerrados en gris */
    .parada-num.pendiente { background: #dc2626; }
    .parada-num.hecho { background: #16a34a; }
    .parada-num.cerrado { background: #64748b; font-size: 12px; }
    .parada-num.subsanar { background: #ea580c; }
    .parada-num.curso { background: #2563eb; font-size: 11px; }
    .ruta-estado.curso { color: #1e40af; background: #dbeafe; }
    .ruta-estado.subsanar { color: #9a3412; background: #ffedd5; }
    .ficha-lote .acciones a.subsanar-btn { color: #fff; background: #15803d; }
    .ficha-lote .acciones a.subsanar-btn:hover { color: #fff; background: #166534; }
    #leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 600; }
    #leyenda span { display: inline-flex; align-items: center; gap: 5px; }
    #leyenda i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
    .ficha-lote .ruta-estado { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .ruta-estado.pendiente { color: #b91c1c; background: #fee2e2; }
    .ruta-estado.hecho { color: #15803d; background: #dcfce7; }
    .ruta-estado.cerrado { color: #334155; background: #e2e8f0; }
    .ficha-lote .linea-estado { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; }
    .ficha-lote .linea-estado .ruta-estado { margin-top: 0; }
    /* Leaflet pinta de azul los enlaces del mapa: se fija el color del botón */
    .ficha-lote a.ver-visita { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none;
                               color: #fff; background: var(--brand); }
    .ficha-lote a.ver-visita:hover { color: #fff; background: var(--brand-dark); }
    .ficha-lote .visita-det { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: #f2fbf7; border-left: 3px solid var(--brand); }
    .ficha-lote .visita-det .datos { margin: 0 0 8px; }
    .ficha-lote .visita-det .dato { background: #fff; }
    .ficha-lote .chip-no { display: inline-block; margin: 3px 4px 0 0; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: #b91c1c; background: #fee2e2; }
    .ficha-lote .visita-det .copia { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .ficha-lote .visita-det a.editar-visita { display: block; text-align: center; margin-top: 8px; padding: 9px; color: var(--brand); background: #fff; border: 1px solid #9fd3bd; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 2000; display: none; max-width: calc(100% - 32px); }
    /* Ficha del lote: ventana en computador, panel desde abajo en el celular */
    .ficha-lote { font-size: 14px; line-height: 1.35; color: var(--ink); }
    .ficha-lote .cab { display: flex; align-items: center; gap: 8px; padding-right: 26px; }
    .ficha-lote .titulo { font-size: 22px; font-weight: 800; }
    .ficha-lote .cuad { color: #fff; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .ficha-lote .mr { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .ficha-lote .aviso-aprox { margin-top: 8px; padding: 7px 10px; border: 1px dashed #111827; border-radius: 8px; background: #fef9c3; color: #713f12; font-size: 13px; }
    .ficha-lote .datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 10px 0; }
    .ficha-lote .dato { background: var(--bg); border-radius: 8px; padding: 6px 9px; min-width: 0; }
    .ficha-lote .et { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .ficha-lote .dato b { font-size: 14px; overflow-wrap: anywhere; }
    .ficha-lote .bloque { margin: 0 0 10px; }
    .ficha-lote .desc { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .ficha-lote .desc.abierta { display: block; }
    .ficha-lote .mas { color: var(--brand); font-size: 12px; font-weight: 700; cursor: pointer; }
    /* "Este sector": lo que se ve en el polígono tocado, arriba y resaltado */
    .ficha-lote .sector { background: #edf8f3; border-left: 4px solid var(--brand); border-radius: 8px; padding: 8px 10px; }
    .ficha-lote .sector .et { color: var(--brand); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ficha-lote .sector .txt { font-weight: 600; overflow-wrap: anywhere; }
    .ficha-lote .copiar { border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .ficha-lote .desc.plegada { -webkit-line-clamp: 1; line-clamp: 1; color: var(--muted); }
    .ficha-lote .acciones { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 4px; }
    .ficha-lote .acciones .boton { text-align: center; padding: 11px 12px; font-size: 15px; }
    .ficha-lote .acciones .subs, .ficha-lote .acciones .ancho { grid-column: 1 / -1; }
    /* Leaflet pinta de azul todos los enlaces del mapa: se fuerzan los colores de los botones */
    .ficha-lote .acciones a.primario { color: #fff; background: var(--brand); }
    .ficha-lote .acciones a.primario:hover { color: #fff; background: var(--brand-dark); }
    .ficha-lote .acciones a.secundario { color: var(--brand); background: #edf8f3; }
    .ficha-lote .acciones a.secundario:hover { color: var(--brand-dark); background: #dcf1e7; }
    .leaflet-popup-content .ficha-lote { min-width: 250px; }
    /* La X de Leaflet (24 px gris claro) casi no se ve ni se atina: círculo grande como el del panel del celular */
    .leaflet-container a.leaflet-popup-close-button { top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--bg);
        color: var(--ink); font: 600 24px/34px system-ui, sans-serif; z-index: 2; }
    .leaflet-container a.leaflet-popup-close-button:hover { background: #dfe6ea; color: var(--ink); }
    .leaflet-popup-content .ficha-lote .cab { padding-right: 76px; }
    /* ⤢ Ampliar la ventana del lote: al lado de la X, con el mismo estilo */
    .ampliar-ficha { position: absolute; top: 8px; right: 48px; z-index: 2; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
        background: var(--bg); color: var(--ink); font: 600 18px/34px system-ui, sans-serif; text-align: center; cursor: pointer; }
    .ampliar-ficha:hover { background: #dfe6ea; }
    .leaflet-popup.grande .ficha-lote { min-width: 380px; }
    /* La ventana se arrastra por el título para ver el lote que tapa; ya movida, la punta no señala nada */
    .leaflet-popup-content .ficha-lote .cab { cursor: move; touch-action: none; user-select: none; }
    .leaflet-popup.movida .leaflet-popup-tip-container { display: none; }
    .leaflet-popup.movida .leaflet-popup-content-wrapper { box-shadow: 0 8px 28px rgba(0, 0, 0, .35); }
    .leaflet-popup.arrastrando { opacity: .9; }
    .leaflet-popup.arrastrando .leaflet-popup-content .ficha-lote .cab { cursor: grabbing; }
    #ficha .ampliar-ficha { top: 12px; right: 50px; width: 32px; height: 32px; line-height: 32px; color: var(--muted); }
    #ficha .ficha-lote .cab { padding-right: 76px; }
    #ficha.grande { max-height: calc(100dvh - 24px); }
    #ficha { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1002; background: var(--surface); border-radius: 16px 16px 0 0;
             box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); padding: 6px 16px calc(16px + env(safe-area-inset-bottom));
             max-height: 55vh; overflow-y: auto; transform: translateY(105%); transition: transform .22s ease; }
    #ficha.abierta { transform: none; }
    #ficha .asa { width: 40px; height: 5px; border-radius: 3px; background: #cbd5db; margin: 2px auto 10px; }
    #ficha .cerrar { position: absolute; top: 12px; right: 10px; background: var(--bg); color: var(--muted); width: 32px; height: 32px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 32px; }
    #btn-plegar, #btn-completo .ico, #btn-capas, #hoja-capas { display: none; }
    .hoja-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .hoja-cab b { font-size: 17px; }
    #hoja-capas .asa { width: 40px; height: 5px; border-radius: 3px; background: #cbd5db; margin: 2px auto 10px; }
    @media (max-width: 760px) {
        #barra { padding: 6px 8px 5px; gap: 5px; }
        .fila input { font-size: 16px; min-height: 36px; }
        .fila .boton, .fila button { padding: 8px 10px; }
        /* Celular: la barra se pliega a solo el buscador para dejarle el espacio al mapa */
        /* Celular: las cuadrillas y capas van en una hoja que sube desde abajo (a mano del pulgar); arriba solo el buscador */
        #btn-capas { display: inline-flex; align-items: center; gap: 6px; position: fixed; left: 12px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 1001;
                     padding: 13px 18px; border-radius: 999px; font-size: 15px; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); max-width: calc(100% - 24px); }
        body.con-ficha #btn-capas, body.con-sel #btn-capas, body:not(.barra-plegada) #btn-capas { display: none; }
        #hoja-capas { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1002; background: var(--surface); border-radius: 16px 16px 0 0;
                      box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); padding: 6px 14px calc(16px + env(safe-area-inset-bottom)); max-height: 72vh; overflow-y: auto;
                      transform: translateY(105%); transition: transform .22s ease; }
        body:not(.barra-plegada) #hoja-capas { transform: none; }
        #hoja-capas .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; overflow: visible; padding: 0; }
        #hoja-capas .chip { justify-content: center; padding: 13px 4px; font-size: 15px; border-radius: 12px; }
        #hoja-capas .chip .punto { width: 12px; height: 12px; }
        #hoja-capas .separador { grid-column: 1 / -1; width: auto; height: 1px; margin: 4px 0; }
        #hoja-capas [data-todas], #hoja-capas [data-cuad="sin"], #hoja-capas .chip.modo, #hoja-capas .chip.capa { grid-column: span 2; }
        #btn-completo .txt { display: none; }
        #btn-completo .ico { display: inline; }
    }
    .barrido-punta { font-size: 20px; line-height: 24px; text-align: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    .pin-fijada { font-size: 26px; line-height: 28px; text-align: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
    /* Pin libre (mantener presionado o 📌): se arrastra para ajustarlo */
    .pin-libre { font-size: 30px; line-height: 32px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.55)); cursor: grab; }
    #btn-pin.activo { color: #fff; background: #d92d20; }
    .ficha-pin .acciones button:disabled { opacity: .6; }
    .etiqueta-zona { background: rgba(255,255,255,.85); border: 0; box-shadow: none; font-weight: 700; padding: 1px 6px; }
    .etiqueta-zona::before { display: none; }
    /* Armar pre-ruta tocando lotes: barra abajo con los elegidos */
    #sel-barra { position: fixed; left: 10px; right: 10px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 1001; background: var(--surface); border-radius: 14px;
                 box-shadow: 0 4px 18px rgba(0, 0, 0, .3); padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #sel-barra .txt { flex: 1 1 160px; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
    #sel-barra .txt b { font-size: 15px; }
    #sel-barra button:disabled { opacity: .5; cursor: default; }
    .chip.modo[aria-pressed="true"] { border-color: #7c3aed; background: #f3e8ff; box-shadow: inset 0 0 0 1px #7c3aed; }
    .ficha-lote .ruta-estado.vencido { color: #b91c1c; background: #fee2e2; }
    .ficha-lote .ruta-estado.pronto { color: #92400e; background: #fef3c7; }
    .ficha-lote .ruta-estado.aldia { color: #15803d; background: #dcfce7; }
    .halo-lote { animation: halo-lote 1.4s ease-in-out infinite; }
    @keyframes halo-lote { 50% { stroke-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .halo-lote { animation: none; } }
    </style>
</head>
<body>
<div id="barra">
    <div class="fila">
        <input id="buscar" type="search" placeholder="Lote, microrruta, dirección o coordenadas (532 · Z7R191B · CR 38 # 91 83 · 6.2751N 75.5737W)" aria-label="Buscar lote, microrruta, dirección o coordenadas"
               autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="primario" id="btn-buscar">Buscar</button>
        <button type="button" class="secundario" id="btn-foto" title="Ubicar el lote con una foto que tenga las coordenadas GPS" aria-label="Ubicar con foto">📷</button>
        <input type="file" id="foto" accept="image/*" hidden>
        <button type="button" class="secundario" id="btn-pin" title="Poner un pin en cualquier punto y ver cómo llegar (también: mantener presionado el mapa)" aria-label="Poner pin">📌</button>
        <button type="button" class="secundario" id="btn-plegar" aria-controls="chips" title="Mostrar u ocultar las cuadrillas y capas">▴</button>
        <a class="boton secundario" id="btn-completo" href="index.html" title="Abrir el mapa completo con todas las capas" aria-label="Mapa completo"><span class="txt">Mapa completo</span><span class="ico" aria-hidden="true">🗺️</span></a>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Cuadrillas y capas"></div>
    <div id="estado"></div>
    <div id="leyenda" hidden></div>
</div>
<div id="map"></div>
<div id="ficha" role="dialog" aria-label="Datos del lote"><div class="asa"></div><button type="button" class="ampliar-ficha" data-ampliar aria-label="Ampliar">⤢</button><button type="button" class="cerrar" id="ficha-cerrar" aria-label="Cerrar">×</button><div id="ficha-contenido"></div></div>
<div id="sel-barra" hidden><div class="txt" id="sel-txt"></div>
    <button type="button" class="secundario" id="sel-cancelar">Cancelar</button>
    <button type="button" class="primario" id="sel-crear">Crear pre-ruta</button></div>
<button type="button" class="primario" id="btn-capas" aria-controls="hoja-capas">🗂 Capas</button>
<div id="hoja-capas" role="dialog" aria-label="Capas del mapa"><div class="asa"></div>
    <div class="hoja-cab"><b>Capas del mapa</b><button type="button" class="primario" id="hoja-listo">Listo</button></div>
    <div id="hoja-cuerpo"></div></div>
<div class="toast" id="toast"></div>

<script src="js/leaflet.js"></script>
<script src="data/rapido/indice.js"></script>
<script src="js/coordenadas.js"></script>
<script src="js/direcciones.js"></script>
<script src="js/camara_marca.js"></script>
<script>
(function () {
    var IDX = window.indiceRapido || { cuadrillas: {}, lotes: {}, mrs: {}, capas: {} };
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, Math.max(3500, msg.length * 60)); }
    function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function leer(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }

    // ---------- Mapa (canvas: dibuja miles de polígonos mucho más rápido en el celular) ----------
    var map = L.map('map', { preferCanvas: true, zoomControl: false, maxZoom: 21 }).setView([6.271116, -75.569759], 15); // arranca en el centro-norte de Medellín, no en todo el valle
    L.control.zoom({ position: 'topleft' }).addTo(map);
    var satelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 21, maxNativeZoom: 20, attribution: 'Imágenes © Google' });
    var calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19, attribution: '© OpenStreetMap' });
    // Ortofoto oficial de la Alcaldía (agosto 2025): los lotes se dibujaron sobre ella, así que cuadran con andenes y separadores.
    // Google se ve corrido unos metros en Medellín por la inclinación de sus fotos.
    var orto = L.tileLayer('https://www.medellin.gov.co/servidormapas/rest/services/ServiciosCiudad/IMAGEN_WEBM_2024/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 21, attribution: 'Ortofoto © Alcaldía de Medellín' });
    // Servicio sin año: la ortofoto vigente de la Alcaldía, cambia sola cuando publiquen una nueva.
    var alcaldia = L.tileLayer('https://www.medellin.gov.co/servidormapas/rest/services/ServiciosCiudad/IMAGEN_WEBM/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 21, attribution: 'Ortofoto © Alcaldía de Medellín' });
    var bases = { orto: orto, alcaldia: alcaldia, satelite: satelite, calles: calles };
    (bases[leer('rapido_fondo', 'orto')] || orto).addTo(map);
    L.control.layers({ 'Ortofoto Medellín 2025': orto, 'Ortofoto Alcaldía (vigente)': alcaldia, 'Satélite Google': satelite, 'Calles': calles }, null, { position: 'topright' }).addTo(map);
    map.on('baselayerchange', function (e) { guardar('rapido_fondo', Object.keys(bases).filter(function (k) { return bases[k] === e.layer; })[0] || 'orto'); });

    // Ubicación seguida todo el tiempo (punto azul); "Cómo llegar" sale siempre desde aquí.

        var nombres = activas.map(function (c) { return c === 'sin' ? 'S/C' : 'C' + c; });

        $('btn-capas').textContent = '🗂 Capas' + (!nombres.length ? '' : ' · ' + (nombres.length <= 3 ? nombres.join(' · ') : nombres.length + ' cuadrillas'));

    $('btn-plegar').onclick = function () { plegarBarra(!plegada); };
    $('btn-capas').onclick = function () { plegarBarra(false); };
    $('hoja-listo').onclick = function () { plegarBarra(true); };

    function pintarChips() {
        var todas = ordenCuad.length && ordenCuad.every(function (c) { return activas.indexOf(c) !== -1; });
        $('chips').innerHTML =
            '<button type="button" class="chip" data-todas aria-pressed="' + todas + '" title="Cargar todas las cuadrillas">Todas</button>' +
            ordenCuad.map(function (c) {
                var info = IDX.cuadrillas[c], on = activas.indexOf(c) !== -1, cargando = on && !grupos[c];
                return '<button type="button" class="chip' + (cargando ? ' cargando' : '') + '" data-cuad="' + esc(c) + '" aria-pressed="' + on + '" title="' + info.n + ' lotes · ' + info.kb + ' KB">' +
                    '<span class="punto" style="background:' + colorCuadrilla(c) + '"></span>' + (c === 'sin' ? 'Sin cuadrilla' : 'C' + esc(c)) + '</button>';
            }).join('') +
            '<span class="separador"></span>' +
            '<button type="button" class="chip modo" data-vencidos aria-pressed="' + !!vencidos + '" title="Colorear los lotes según su última visita y la frecuencia">⏰ Vencidos</button>' +
            '<button type="button" class="chip modo" data-sel aria-pressed="' + !!seleccion + '" title="Tocar varios lotes y armar con ellos una pre-ruta">☑ Armar pre-ruta</button>' +
            '<button type="button" class="chip modo" data-precision aria-pressed="' + !!verPrecision + '" title="Círculo azul alrededor de su ubicación: el margen de error del GPS">◎ Precisión GPS</button>' +
            '<span class="separador"></span>' +
            Object.keys(IDX.capas || {}).map(function (k) {
                return '<button type="button" class="chip capa" data-capa="' + k + '" aria-pressed="' + (capasActivas.indexOf(k) !== -1) + '" title="' + IDX.capas[k].kb + ' KB">' + NOMBRES_CAPA[k] + '</button>';
            }).join('');
        var n = 0, kb = 0;
        activas.forEach(function (c) { n += IDX.cuadrillas[c].n; kb += IDX.cuadrillas[c].kb; });
        var faltan = activas.filter(function (c) { return !grupos[c]; }).length;
        // En el celular las cuadrillas están en la hoja del botón 🗂 Capas (abajo); en el computador, en esta barra
        $('estado').textContent = !activas.length ? (movil.matches && plegada ? 'Toque 🗂 Capas (abajo) y elija una o varias cuadrillas para ver sus lotes.' : 'Elija una o varias cuadrillas para ver sus lotes.') :
            (faltan ? 'Cargando… ' : '') + (activas.length === 1 ? (activas[0] === 'sin' ? 'Sin cuadrilla' : 'Cuadrilla ' + activas[0]) : activas.length + ' cuadrillas') +
            ' · ' + n.toLocaleString('es-CO') + ' lotes · ' + (kb >= 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB');
        pintarPlegar();
    }
    function mostrarCuadrillas(encuadrar) {
        guardar('rapido_cuadrillas', activas);
        Object.keys(grupos).forEach(function (c) { if (activas.indexOf(c) === -1 && map.hasLayer(grupos[c])) map.removeLayer(grupos[c]); });
        activas.forEach(function (c) {
            asegurarCuadrilla(c, function () {
                if (activas.indexOf(c) !== -1 && !map.hasLayer(grupos[c])) grupos[c].addTo(map);
                pintarChips();
                if (vencidos && !estadoRuta) leyendaVence();
            });
        });
        if (encuadrar && activas.length) {
            // Los límites vienen en el índice: se encuadra de una vez, sin esperar la descarga
            var b = L.latLngBounds([]);
            activas.forEach(function (c) { b.extend(IDX.cuadrillas[c].b); });
            map.fitBounds(b, { padding: [20, 20] });
        }
        pintarChips();
    }
    function mostrarCapa(k, on) {
        if (!on) { if (capasExtra[k]) map.removeLayer(capasExtra[k]); return; }
        if (capasExtra[k]) capasExtra[k].addTo(map);
        else cargarArchivo('capa_' + k, function () { if (capasActivas.indexOf(k) !== -1) capasExtra[k].addTo(map); });
    }
    $('chips').onclick = function (ev) {
        var b = ev.target.closest('button');
        if (!b) return;

            activas = todas ? [] : ordenCuad.slice();

        }
        if (b.dataset.cuad) {

            mostrarCapa(k, j === -1);
            pintarChips();

    };

    // ---------- Buscar lote(s) o microrruta ----------
    // Varios lotes separados por coma = una ruta: se resaltan y se numeran en ese orden
    var marcadores = L.layerGroup().addTo(map);
    function ir(valores, abrirVentana) {
        // n: número de parada según el orden recibido, aunque algún lote no se encuentre
        var claves = valores.map(clave).map(function (v, i) {
            if (!v) return null;
            var cuad = IDX.lotes[v] || IDX.mrs[v];
            return cuad ? { v: v, n: i + 1, cuad: cuad, esMr: !IDX.lotes[v] } : { v: v };
        }).filter(Boolean);
        var faltan = claves.filter(function (k) { return !k.cuad; });
        if (faltan.length) toast('No se encontró: ' + faltan.map(function (k) { return k.v; }).join(', '));
        claves = claves.filter(function (k) { return k.cuad; });
        if (!claves.length) return;
        // Activa las cuadrillas que hagan falta, sin quitar las que ya estaban
        claves.forEach(function (k) { if (activas.indexOf(k.cuad) === -1) activas.push(k.cuad); });
        mostrarCuadrillas(false);
        var pendientes = claves.length;
        claves.forEach(function (k) { asegurarCuadrilla(k.cuad, function () { if (--pendientes === 0) listo(); }); });
        function listo() {
            var capas = [], cuenta = { pendiente: 0, hecho: 0, subsanar: 0, cerrado: 0, curso: 0 };
            marcadores.clearLayers();
            limpiarResaltado();
            enRuta.forEach(function (c) { delete c.rutaEstado; delete c.rutaVisita; c.setStyle(estiloBase(c)); });
            enRuta = [];
            claves.forEach(function (k) {
                var cs = (k.esMr ? porMr : porLote)[k.v] || [];
                capas = capas.concat(cs);
                var est = estadoRuta && cs.length ? estadoRuta[k.v] || 'pendiente' : '';
                // La copia guardada manda sobre el enlace: un lote marcado subsanado después ya sale en verde
                var rv = est && visitaRuta[k.v] && visitaGuardada(visitaRuta[k.v]);
                if (rv) est = estadoDeVisita(rv.r.ESTADO);
                if (est) {
                    cuenta[est]++;
                    cs.forEach(function (c) { c.rutaEstado = est; c.rutaVisita = visitaRuta[k.v] || ''; c.setStyle(ESTILO_RUTA[est]); enRuta.push(c); });
                    // Los pendientes encima, para que no los tape un lote vecino ya revisado
                    if (est === 'pendiente') cs.forEach(function (c) { c.bringToFront(); });
                }
                if (claves.length > 1 && cs.length) {
                    // El número va en el pedazo más grande del lote: el mismo punto con que la pre-ruta mide distancias
                    var mayor = cs.reduce(function (m, c) { return areaMayor(c) > areaMayor(m) ? c : m; });
                    var html =est === 'hecho' ? '✓' : est === 'cerrado' ? '🔒' : est === 'subsanar' ? '!' : est === 'curso' ? '▶' : String(k.n);
                    L.marker(puntoLote(mayor), { icon: L.divIcon({ className: 'parada-num' + (est ? ' ' + est : ''), html: html }),
                        title: (k.esMr ? '' : 'Lote ') + k.v + (est ? ' · ' + TEXTO_RUTA[est] : ''), zIndexOffset: est === 'pendiente' ? 1000 : 0 })
                        .on('click', function () { if (seleccion) alternarSel(cs[0]); else verLote(cs[0]); }).addTo(marcadores);
                }
            });
            pintarLeyenda(estadoRuta ? cuenta : null);
            if (!capas.length) return;
            if (!estadoRuta) resaltar(capas);
            var abrir = abrirVentana && claves.length === 1;
            if (movil.matches) plegarBarra(true);
            // Celular: primero el panel, porque su alto dice cuánto mapa queda a la vista para el lote
            if (abrir && movil.matches) verLote(capas[0]);
            encuadrar(L.featureGroup(capas).getBounds(), abrir);
            if (abrir && !movil.matches) verLote(capas[0]);
        }
    }
    // Acerca el mapa al lote. Con la ficha abierta: sin animación (si el mapa sigue moviéndose, la ventana del computador
    // queda cortada arriba) y, en el celular, el lote queda en el pedazo de mapa que no tapa el panel
    function encuadrar(bounds, conFicha) {
        var abajo = conFicha && movil.matches ? $('ficha').offsetHeight : 0;
        map.fitBounds(bounds, { paddingTopLeft: [30, 30], paddingBottomRight: [30, 30 + abajo], maxZoom: 19, animate: !conFicha });
    }
    // Mismo formato que IDX: mayúsculas y lotes sin ceros a la izquierda
    function clave(v) { v = String(v || '').trim().toUpperCase(); return /^\d+$/.test(v) ? String(+v) : v; }
    function pintarLeyenda(cuenta) {
        if (!cuenta && vencidos) return leyendaVence();
        $('leyenda').hidden = !cuenta;
        if (!cuenta) return;
        var tipos = [['pendiente', 'por revisar', 'por revisar'], ['curso', 'en ejecución', 'en ejecución'], ['hecho', 'revisado', 'revisados'],
                     ['subsanar', 'por subsanar', 'por subsanar'], ['cerrado', 'cerrado', 'cerrados']];
        $('leyenda').innerHTML = tipos.filter(function (t) { return cuenta[t[0]] || t[0] === 'pendiente' || t[0] === 'hecho'; }).map(function (t) {
            var e = ESTILO_RUTA[t[0]], n = cuenta[t[0]];
            return '<span><i style="background:' + e.fillColor + ';border-color:' + e.color + '"></i>' + n + ' ' + (n === 1 ? t[1] : t[2]) + '</span>';
        }).join('');
    }
    // Cuántos lotes de las cuadrillas visibles hay en cada estado (un lote de varias partes cuenta una vez)
    function leyendaVence() {
        var cuenta = { vencido: 0, pronto: 0, aldia: 0, sin: 0 }, vistos = {};
        Object.keys(grupos).forEach(function (k) {
            if (!map.hasLayer(grupos[k])) return;
            grupos[k].eachLayer(function (c) { var id = idCapa(c); if (vistos[id]) return; vistos[id] = 1; cuenta[venceDe(c).estado]++; });
        });
        $('leyenda').hidden = false;
        $('leyenda').innerHTML = ['vencido', 'pronto', 'aldia', 'sin'].map(function (t) {
            var e = ESTILO_VENCE[t], n = cuenta[t];
            return '<span><i style="background:' + e.fillColor + ';border-color:' + e.color + '"></i>' + n + ' ' + TEXTO_VENCE[t][n === 1 ? 0 : 1] + '</span>';
        }).join('') + (copia() ? '' : '<span>· Abra subsanaciones una vez para traer las visitas</span>');
    }

    // ---------- Armar pre-ruta tocando lotes ----------
    // seleccion: ids (lote o microrruta) en el orden en que se tocaron; null = modo apagado
    var seleccion = null;
    function partesDe(id) { return /^\d+$/.test(id) ? porLote[id] || [] : porMr[id] || []; }
    function alternarSel(capa) {
        var id = idCapa(capa), i = seleccion.indexOf(id);
        if (i === -1) seleccion.push(id); else seleccion.splice(i, 1);
        partesDe(id).concat([capa]).forEach(function (c) { c.setStyle(estiloBase(c)); if (i === -1) c.bringToFront(); });
        pintarSel();
    }
    function pintarSel() {
        $('sel-barra').hidden = !seleccion;
        document.body.classList.toggle('con-sel', !!seleccion);
        if (!seleccion) return;
        $('sel-txt').innerHTML = seleccion.length ? '<b>' + seleccion.length + ' lote' + (seleccion.length === 1 ? '' : 's') + '</b> · ' + esc(seleccion.join(', '))
            : '<b>Toque los lotes</b> para la pre-ruta';
        $('sel-crear').disabled = !seleccion.length;
    }
    function modoSel(on) {
        var antes = seleccion || [];
        seleccion = on ? [] : null;
        if (on) cerrarFicha();
        antes.forEach(function (id) { partesDe(id).forEach(function (c) { c.setStyle(estiloBase(c)); }); });
        pintarSel();
        pintarChips();
        if (on) toast(activas.length ? 'Toque los lotes que quiere en la pre-ruta.' : 'Elija una cuadrilla y toque sus lotes.');
    }
    $('sel-cancelar').onclick = function () { modoSel(false); };
    $('sel-crear').onclick = function () {
        if (!seleccion || !seleccion.length) return;
        // Cuadrilla: la de los lotes si todos son de la misma
        var cuads = seleccion.map(function (id) { var c = partesDe(id)[0]; return c ? String(c.lote.c || '') : ''; })
            .filter(function (c, i, a) { return a.indexOf(c) === i; });
        location.href = 'subsanaciones.html?preruta=' + encodeURIComponent(seleccion.join(',')) + (cuads.length === 1 && cuads[0] ? '&cuad=' + encodeURIComponent(cuads[0]) : '');
    };

    // ---------- Ubicar el lote por coordenadas (escritas o leídas de una foto) ----------
    var puntoCapa = L.layerGroup().addTo(map);
    // Metros aproximados en la zona (proyección plana local: sobra para distancias de cientos de metros)
    function plano(ll, lat0) { return { x: ll.lng * 111320 * Math.cos(lat0 * Math.PI / 180), y: ll.lat * 110540 }; }
    function anillos(capa) {
        var out = [];
        (function recorrer(a) { if (a.length && a[0] instanceof L.LatLng) out.push(a); else a.forEach(recorrer); })(capa.getLatLngs());
        return out;
    }
    // Par/impar sobre todos los anillos: respeta los huecos y los lotes de varias partes
    function contiene(capa, ll) {
        if (!capa.getBounds().contains(ll)) return false;
        var dentro = false;
        anillos(capa).forEach(function (a) {
            for (var i = 0, j = a.length - 1; i < a.length; j = i++) {
                var yi = a[i].lat, yj = a[j].lat, xi = a[i].lng, xj = a[j].lng;
                if ((yi > ll.lat) !== (yj > ll.lat) && ll.lng < (xj - xi) * (ll.lat - yi) / (yj - yi) + xi) dentro = !dentro;
            }
        });
        return dentro;
    }
    function distanciaBorde(capa, ll) {
        var p = plano(ll, ll.lat), min = Infinity;
        anillos(capa).forEach(function (a) {
            for (var i = 0, j = a.length - 1; i < a.length; j = i++) {
                var A = plano(a[j], ll.lat), B = plano(a[i], ll.lat), dx = B.x - A.x, dy = B.y - A.y;
                var t = dx || dy ? Math.max(0, Math.min(1, ((p.x - A.x) * dx + (p.y - A.y) * dy) / (dx * dx + dy * dy))) : 0;
                min = Math.min(min, Math.hypot(p.x - A.x - t * dx, p.y - A.y - t * dy));
            }
        });
        return min;
    }
    var CERCA_M = 150;
    function ubicarPunto(c) {
        var ll = L.latLng(c.lat, c.lng), txt = c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
        // Coordenadas mal escritas que coordenadas.js arregló: se dice qué se cambió
        var aviso = (c.corregida ? ' Se escribió ' + c.escrita + ' (' + c.corregida + '); se buscó ' + txt + '.' : '') + (c.nota || '');
        estadoRuta = null;
        marcadores.clearLayers();
        puntoCapa.clearLayers();
        L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#7c3aed', fillOpacity: 1, bubblingMouseEvents: false })
            .bindTooltip('📍 ' + txt, { direction: 'top', offset: [0, -8] }).addTo(puntoCapa);
        $('buscar').value = c.buscado || txt;
        // Solo se cargan las cuadrillas cuyo recuadro (con margen) incluye el punto
        var cuads = ordenCuad.filter(function (k) { return L.latLngBounds(IDX.cuadrillas[k].b).pad(0.05).contains(ll); });
        if (!cuads.length) { map.setView(ll, 17); return toast('El punto ' + txt + ' queda fuera de la zona de los lotes.' + aviso); }
        cuads.forEach(function (k) { if (activas.indexOf(k) === -1) activas.push(k); });
        mostrarCuadrillas(false);
        map.setView(ll, 18);

        cuads.forEach(function (k) { asegurarCuadrilla(k, function () { if (--faltan === 0) elegir(); }); });
        function elegir() {
            var dentro = null, cerca = null, dmin = Infinity;
            cuads.forEach(function (k) {
                grupos[k].eachLayer(function (capa) {
                    if (dentro) return;
                    if (contiene(capa, ll)) { dentro = capa; return; }
                    // Descarta rápido los lotes lejanos antes de medir el borde
                    if (!capa.getBounds().pad(0.5).contains(ll) && capa.getBounds().getCenter().distanceTo(ll) > CERCA_M * 4) return;
                    var d = distanciaBorde(capa, ll);
                    if (d < dmin) { dmin = d; cerca = capa; }
                });
            });
            var capa = dentro || (dmin <= CERCA_M ? cerca : null);
            if (!capa) return toast('No hay lotes a menos de ' + CERCA_M + ' m de ' + txt + '.' + aviso);
            var p = capa.lote, nombre = p.l && p.l !== 'NA' ? 'Lote ' + p.l : p.m;
            resaltarMr(p.m);
            var b = capa.getBounds(), caja = L.latLngBounds(b.getSouthWest(), b.getNorthEast()).extend(ll); // copia: getBounds() es el recuadro interno del lote
            if (movil.matches) { plegarBarra(true); verLote(capa, ll); encuadrar(caja, true); }
            else { encuadrar(caja, false); verLote(capa, ll); }
            toast((dentro ? '📍 Está dentro del ' + nombre : '📍 Ningún lote contiene el punto; el más cercano es el ' + nombre + ' (a ' + Math.round(dmin) + ' m).') + aviso);
        }
    }

    // Foto: primero el GPS guardado en la foto (EXIF); si no lo tiene (WhatsApp lo borra), se lee el texto de la marca de agua
    function cargarScript(src) {
        return new Promise(function (ok, mal) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
    }
    // La foto pone el 📌 en su coordenada (no elige lote: eso se hace con "Ver lote aquí") y deja en el buscador
    // la coordenada como está escrita en la foto. Solo se aceptan puntos de Medellín y sus corregimientos.
    var ZONA_FOTO = L.latLngBounds([5.95, -75.9], [6.55, -75.3]);
    function gms(v, pos, neg) {
        var a = Math.abs(v), g = Math.floor(a), m = Math.floor((a - g) * 60), s = ((a - g) * 60 - m) * 60;
        return g + '°' + m + "'" + s.toFixed(2) + '"' + (v < 0 ? neg : pos);
    }
    function leerFoto(file) {
        $('btn-foto').disabled = true;
        $('estado').textContent = 'Leyendo la ubicación de la foto…';
        var exif = window.exifr ? Promise.resolve() : cargarScript('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js');
        exif.then(function () { return window.exifr.gps(file); }).catch(function () { return null; }).then(function (gps) {
            // GPS guardado en la foto: es el exacto. En el buscador va escrito como en las marcas de agua (grados, minutos, segundos)
            if (gps && isFinite(gps.latitude) && isFinite(gps.longitude)) {
                return { lat: gps.latitude, lng: gps.longitude, texto: gms(gps.latitude, 'N', 'S') + ' ' + gms(gps.longitude, 'E', 'W'), fuente: 'GPS de la foto' };
            }
            $('estado').textContent = 'La foto no trae GPS; leyendo las coordenadas escritas en ella (puede tardar unos segundos)…';
            return leerMarcaDeAgua(file);
        }).then(function (c) {
            if (!c) throw new Error('No se encontraron coordenadas en la foto. Escríbalas en el buscador, p. ej. 6°17\'38.6"N 75°34\'37.8"W.');
            $('buscar').value = c.texto;
            var ll = L.latLng(c.lat, c.lng);
            if (!ZONA_FOTO.contains(ll)) {
                throw new Error('La coordenada leída (' + c.texto + ') queda fuera de Medellín. Puede que el lector se haya equivocado en un número: corríjala en el buscador y pulse Buscar.');
            }
            estadoRuta = null;
            map.setView(ll, 18);
            ponerPin(ll);
            toast(c.dudosa ? '📌 Pin puesto, pero la lectura de la foto no es segura: compare la coordenada del buscador con la de la foto y corríjala si hace falta.'
                : '📌 Pin en la coordenada de la foto (' + c.fuente + '). Para el lote más cercano toque "Ver lote aquí".');
        }).catch(function (err) {
            toast(err && err.message && /coordenada/.test(err.message) ? err.message : 'No se pudo leer la foto. Revise la conexión o escriba las coordenadas.');
        }).then(function () { $('btn-foto').disabled = false; $('foto').value = ''; pintarChips(); });
    }
    // Marca de agua (WhatsApp borra el GPS): el texto es pequeño y va sobre la foto, así que se lee por partes:
    // primero la franja de abajo, ampliada y en blanco y negro (letras claras o oscuras), y al final la foto entera.
    function leerMarcaDeAgua(file) {
        var ocr = window.Tesseract ? Promise.resolve() : cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
        var url = URL.createObjectURL(file), img = new Image(), worker = null;
        var cargada = new Promise(function (ok, mal) { img.onload = ok; img.onerror = mal; img.src = url; });
        // [desde arriba, desde la izquierda, modo]: esquina de abajo a la derecha (donde la ponen las cámaras), franja de abajo, foto entera
        var pasadas = [[0.6, 0.35, 'claro'], [0.6, 0.35, 'gris'], [0.75, 0.45, 'claro'], [0.6, 0.35, 'tenue'], [0.75, 0.45, 'gris'],
            [0.55, 0, 'claro'], [0.55, 0, 'oscuro'], [0.55, 0, 'gris'], [0, 0, 'claro'], [0, 0, 'gris']];
        // Al lector se le puede cambiar o perder un número (17 -> 7, los segundos) y el punto caer igual dentro de Medellín,
        // pero a 1 o 2 km. Se da por buena cuando la lectura está completa (grados, minutos y segundos) y otra pasada leyó lo mismo (±15 m)
        var lecturas = [];
        function siguiente(i) {
            if (i >= pasadas.length) {
                // Ninguna coincidió: una completa dentro de Medellín (dudosa) o, si no, lo mejor que se leyó para corregirlo a mano
                var buenas = lecturas.filter(function (c) { return c.completa && ZONA_FOTO.contains([c.lat, c.lng]); });
                if (buenas.length) { buenas[0].dudosa = true; return buenas[0]; }
                if (lecturas.length) {
                    $('buscar').value = lecturas[0].texto;
                    throw new Error('No se pudo leer completa la coordenada de la foto. Quedó en el buscador lo que se alcanzó a leer: corríjala con la foto y pulse Buscar.');
                }
                return null;
            }
            $('estado').textContent = 'Leyendo las coordenadas escritas en la foto… (' + (i + 1) + ' de ' + pasadas.length + ')';
            return worker.recognize(recorte(img, pasadas[i][0], pasadas[i][1], pasadas[i][2])).then(function (r) {
                var c = window.coordenadasDeFoto(r.data.text);
                if (c) {
                    c.fuente = 'texto de la foto';
                    var igual = c.completa && ZONA_FOTO.contains([c.lat, c.lng]) && lecturas.filter(function (o) {
                        return o.completa && L.latLng(o.lat, o.lng).distanceTo([c.lat, c.lng]) < 15;
                    })[0];
                    if (igual) return igual;
                    lecturas.push(c);
                }
                return siguiente(i + 1);
            });
        }
        return Promise.all([ocr, cargada]).then(function () { return window.Tesseract.createWorker('eng'); }).then(function (w) {
            worker = w;
            // Solo números y símbolos de coordenadas; la marca de agua es un bloque de pocas líneas
            return w.setParameters({ tessedit_char_whitelist: '0123456789.,-+°º\'"’”NSEWOo :/', tessedit_pageseg_mode: '6' });
        }).then(function () { return siguiente(0); }).finally(function () {
            URL.revokeObjectURL(url);
            if (worker) worker.terminate();
        });
    }
    // Parte de la foto desde "arriba" e "izq" (fracciones: 0.6 y 0.35 = esquina de abajo a la derecha), ampliada para que
    // la letra quede de buen tamaño (la foto completa se toma como de 3.200 px de ancho) y pasada a letra negra sobre blanco
    function recorte(img, arriba, izq, modo) {
        var W = img.naturalWidth, H = img.naturalHeight;
        var x0 = Math.round(W * izq), y0 = Math.round(H * arriba), w = W - x0, h = H - y0;
        var escala = Math.max(1, Math.min(4, 3200 / W));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * escala); cv.height = Math.round(h * escala);
        var ctx = cv.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, x0, y0, w, h, 0, 0, cv.width, cv.height);
        var d = ctx.getImageData(0, 0, cv.width, cv.height), p = d.data;
        for (var i = 0; i < p.length; i += 4) {
            var r = p[i], g = p[i + 1], b = p[i + 2], luz = 0.299 * r + 0.587 * g + 0.114 * b;
            var gris = Math.max(r, g, b) - Math.min(r, g, b) < 40;   // texto blanco o negro, no color
            // claro: letra blanca; tenue: letra blanca más gris (JPEG muy comprimido); oscuro: letra negra
            var v = modo === 'claro' ? (luz > 190 && gris ? 0 : 255) : modo === 'tenue' ? (luz > 160 && gris ? 0 : 255) : modo === 'oscuro' ? (luz < 60 && gris ? 0 : 255)
                : Math.max(0, Math.min(255, (luz - 128) * 1.6 + 128));
            p[i] = p[i + 1] = p[i + 2] = v;
        }
        ctx.putImageData(d, 0, 0);
        return cv;
    }
    $('btn-foto').onclick = function () { $('foto').click(); };
    $('foto').onchange = function () { if (this.files[0]) leerFoto(this.files[0]); };

    function buscar() {
        var v = $('buscar').value.trim();
        if (!v) return;
        var coord = window.leerCoordenadas(v);
        if (coord) { ubicarPunto(coord); $('buscar').blur(); return; }
        var dir = window.leerDireccion(v);
        if (dir && dir.incompleta) return toast('Escriba la vía, el cruce y la placa. Ej.: CR 38 # 91 83 o Calle 10 sur 43A 20');
        if (dir) { buscarDireccion(dir); $('buscar').blur(); return; }
        // Microrrutas de barrido (Z7R191B_DOM): todo lo escrito tiene que ser código de barrido
        var partes = v.split(/[,\s]+/).filter(Boolean), cods = partes.map(codigoBarrido);
        if (cods.every(Boolean)) { buscarBarrido(cods); $('buscar').blur(); return; }
        quitarBarridoSel();
        puntoCapa.clearLayers();
        estadoRuta = null; // búsqueda a mano: deja de pintar la pre-ruta
        ir(v.split(/[,\s]+/), true);
        $('buscar').blur();
    }
    // Dirección (js/direcciones.js): se ubica con los cruces guardados (o OpenStreetMap en línea) y se busca el lote de ese punto como con coordenadas.
    // Es aproximada (cruce + metros de la placa); el barrio u otro texto después de la placa no se usa
    function buscarDireccion(d) {
        var cajas = ordenCuad.map(function (k) { return L.latLngBounds(IDX.cuadrillas[k].b); });
        var zona = cajas.reduce(function (z, b) { return z.extend(b); }, L.latLngBounds(cajas[0].getSouthWest(), cajas[0].getNorthEast())).pad(0.1);
        var enLotes = function (ll) { return cajas.some(function (b) { return b.contains([ll.lat, ll.lng]); }); };
        $('btn-buscar').disabled = true;
        $('estado').textContent = 'Buscando ' + d.texto + '…';
        var aviso = function (t) { $('estado').textContent = t; };
        window.ubicarDireccion(d, [zona.getSouth(), zona.getWest(), zona.getNorth(), zona.getEast()], enLotes, aviso).then(function (c) {
            if (!c) return toast('No se encontró ' + d.texto + ' en el mapa. Revise la vía y el cruce, o ponga un 📌 a mano.');
            ubicarPunto({ lat: c.lat, lng: c.lng, buscado: d.texto, nota: ' (' + d.texto + ': ubicación ' + c.aprox + ', confírmela en el mapa)' });
        }).catch(function () {
            toast('No se pudo buscar la dirección. Revise la conexión o use coordenadas.');
        }).then(function () { $('btn-buscar').disabled = false; pintarChips(); });
    }
    $('btn-buscar').onclick = buscar;
    $('buscar').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); buscar(); } });
    map.on('click', function (e) {
        if (modoPin) return ponerPin(e.latlng);
        limpiarResaltado(); cerrarFicha(); quitarBarridoSel();
        if (movil.matches && !plegada) plegarBarra(true);
    });

    // ---------- Pin libre: cualquier punto del mapa, con cómo llegar desde donde está ----------
    // Se pone manteniendo presionado el mapa (clic derecho en el computador) o con 📌 y luego un toque.
    // Se arrastra para afinarlo. La dirección sale de OpenStreetMap (Nominatim) y es aproximada: las coordenadas son las exactas.
    var pin = null, pinDir = null, miDir = null, modoPin = false;
    var iconoPin = L.divIcon({ className: 'pin-libre', html: '📌', iconSize: [32, 32], iconAnchor: [9, 30] });
    function coordTxt(ll) { return ll.lat.toFixed(6) + ', ' + ll.lng.toFixed(6); }
    function activarModoPin(si) {
        modoPin = si;
        $('btn-pin').classList.toggle('activo', si);
        map.getContainer().style.cursor = si ? 'crosshair' : '';
        if (si) toast('Toque el mapa donde quiere el pin (o mantenga presionado en cualquier momento).');
    }
    function ponerPin(ll) {
        activarModoPin(false);
        if (pin) pin.setLatLng(ll);
        else {
            pin = L.marker(ll, { draggable: true, icon: iconoPin, zIndexOffset: 1000 }).addTo(map);
            pin.on('dragend', function () { ponerPin(pin.getLatLng()); });
            pin.on('click', verPin);
        }
        pinDir = null;
        verPin();
        direccionDe(ll).then(function (d) { if (pin && pin.getLatLng().equals(ll)) { pinDir = d; if (fichaPinAbierta()) verPin(); } });
    }
    function quitarPin() { if (pin) map.removeLayer(pin); pin = null; pinDir = null; cerrarFicha(); map.closePopup(); }
    function fichaPinAbierta() { return !!document.querySelector('.ficha-pin'); }
    // Dirección aproximada de un punto: "Calle 97 #73-20, Castilla, Medellín" (sin conexión o sin dato: null)
    var cacheDir = {};
    function direccionDe(ll) {
        var k = ll.lat.toFixed(5) + ',' + ll.lng.toFixed(5);
        if (cacheDir[k]) return Promise.resolve(cacheDir[k]);
        return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=es&lat=' + ll.lat + '&lon=' + ll.lng)
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
                var a = j && j.address;
                if (!a) return null;
                var via = a.road || a.pedestrian || a.footway || a.path || '', num = a.house_number ? ' #' + a.house_number : '';
                var ciudad = String(a.city || a.town || a.village || '').replace(/^Per[ií]metro Urbano\s+/i, '');
                var d = [via + num, a.neighbourhood || a.suburb || a.quarter || '', ciudad].filter(Boolean).join(', ');
                return (cacheDir[k] = d || null);
            })
            .catch(function () { return null; });
    }
    function urlRuta(desde, hasta) {
        return 'https://www.google.com/maps/dir/?api=1' + (desde ? '&origin=' + desde.lat.toFixed(6) + ',' + desde.lng.toFixed(6) : '') +
            '&destination=' + hasta.lat.toFixed(6) + ',' + hasta.lng.toFixed(6) + '&travelmode=driving';
    }
    function fichaPin() {
        var ll = pin.getLatLng(), o = origen(), d = o ? o.distanceTo(ll) : null;
        var dist = d == null ? '' : d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(d) + ' m';
        var dato = function (t, v) { return v ? '<div class="dato"><span class="et">' + t + '</span><b>' + esc(v) + '</b></div>' : ''; };
        return '<div class="ficha-lote ficha-pin">' +
            '<div class="cab"><span class="titulo">📌 Punto marcado</span></div>' +
            '<div class="mr">Arrastre el pin para ajustarlo</div>' +
            '<div class="datos">' + dato('Coordenadas', coordTxt(ll)) + dato('Desde usted', dist || (o ? '' : 'sin GPS')) + '</div>' +
            '<div class="bloque"><span class="et">Dirección aproximada</span><div class="txt">' + esc(pinDir || 'Buscando…') + '</div></div>' +
            '<div class="acciones">' +
                '<a class="boton primario" data-pin-ir href="' + esc(urlRuta(o, ll)) + '" target="_blank" rel="noopener">🧭 Cómo llegar</a>' +
                '<button type="button" class="boton secundario" data-pin-enviar>📤 Enviar ruta</button>' +
                '<a class="boton secundario" href="https://waze.com/ul?ll=' + ll.lat.toFixed(6) + ',' + ll.lng.toFixed(6) + '&navigate=yes" target="_blank" rel="noopener">Waze</a>' +
                '<button type="button" class="boton secundario" data-pin-copiar>📋 Copiar</button>' +
                '<a class="boton secundario ancho" href="' + esc(urlCalle(ll)) + '" target="_blank" rel="noopener">🚶 Ver la calle (Street View)</a>' +
                '<button type="button" class="boton secundario" data-pin-lote>Ver lote aquí</button>' +
                '<button type="button" class="boton secundario" data-pin-quitar>✕ Quitar pin</button>' +
            '</div></div>';
    }
    function verPin() { if (pin) abrirPanel(fichaPin(), pin.getLatLng()); }
    // Texto para mandar: de dónde sale (su ubicación), a dónde llega (el pin) y el enlace de la ruta
    function textoRuta() {
        var ll = pin.getLatLng(), o = origen();
        return Promise.all([o ? direccionDe(o) : null, pinDir || direccionDe(ll)]).then(function (r) {
            miDir = r[0]; pinDir = r[1] || pinDir;
            return ['🧭 Ruta al punto marcado',
                o ? '📍 Desde: ' + (miDir ? miDir + ' (' + coordTxt(o) + ')' : coordTxt(o)) : '📍 Desde: su ubicación actual',
                '📌 Hasta: ' + (pinDir ? pinDir + ' (' + coordTxt(ll) + ')' : coordTxt(ll)),
                urlRuta(o, ll)].join('\n');
        });
    }
    document.addEventListener('click', function (ev) {
        if (!pin || !ev.target.closest) return;
        // El enlace se arma al tocarlo: así sale de la ubicación de ese momento
        var ir = ev.target.closest('a[data-pin-ir]');
        if (ir) ir.href = urlRuta(origen(), pin.getLatLng());
        if (ev.target.closest('[data-pin-quitar]')) return quitarPin();
        if (ev.target.closest('[data-pin-lote]')) { var ll = pin.getLatLng(); return ubicarPunto({ lat: ll.lat, lng: ll.lng }); }
        var enviar = ev.target.closest('[data-pin-enviar]'), copiar = ev.target.closest('[data-pin-copiar]');
        if (!enviar && !copiar) return;
        var boton = enviar || copiar;
        boton.disabled = true;
        textoRuta().then(function (t) {
            if (enviar && navigator.share) return navigator.share({ title: 'Ruta al punto marcado', text: t }).catch(function () {});
            if (enviar) return window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
            var listo = function () { toast('Ruta copiada: péguela en WhatsApp'); };
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(listo, function () { copiarViejo(t) && listo(); });
            if (copiarViejo(t)) listo();
        }).then(function () { boton.disabled = false; if (fichaPinAbierta()) verPin(); });
    });
    map.on('contextmenu', function (e) { ponerPin(e.latlng); });
    $('btn-pin').onclick = function () { activarModoPin(!modoPin); };

    // ---------- 📸 Foto con fecha, GPS y marca de agua (js/camara_marca.js) ----------
    // Usa el GPS real (no la ubicación fijada con "Estoy aquí"): la foto es evidencia de dónde se tomó
    var camara = window.camaraMarca({
        posicion: function () { return miPos ? { lat: miPos.lat, lng: miPos.lng, prec: miPrec, hora: miHora } : null; },
        direccion: direccionDe,
        toast: toast
    });
    // Bajo el zoom y ◎, con el mismo estilo: 📸 foto, ⚙️ ajustes de la marca, 📋 subsanaciones y 📝 PQR
    var Herramientas = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function () {
            var div = L.DomUtil.create('div', 'leaflet-bar herramientas');
            div.innerHTML = '<a href="#" role="button" data-h="foto" title="Tomar foto con fecha, GPS y marca de agua" aria-label="Tomar foto">📸</a>' +
                '<a href="#" role="button" data-h="ajustes" title="Ajustes de la marca de agua" aria-label="Ajustes de la marca de agua">⚙️</a>' +
                '<a href="subsanaciones.html" title="Ir a las subsanaciones y pre-rutas" aria-label="Subsanaciones">📋</a>' +
                '<a href="pqr.html" title="PQR: leer la queja y armar la respuesta" aria-label="PQR">📝</a>';
            L.DomEvent.disableClickPropagation(div);
            div.addEventListener('click', function (ev) {
                var a = ev.target.closest('a[data-h]');
                if (!a) return;
                ev.preventDefault();
                camara[a.dataset.h]();
            });
            return div;
        }
    });
    map.addControl(new Herramientas());

    // ---------- Inicio ----------
    // mapa_rapido.html?lote=532,371  ·  ?mr=Z2CC0308  ·  ?c=2,7 (cuadrillas)  ·  ?q=dirección o lo que se escribe en el buscador
    // Desde la pre-ruta: ?lote=532,371,363&hechos=371&cerrados=363 (los demás quedan como pendientes)
    var q = new URLSearchParams(location.search);
    if (q.has('hechos') || q.has('cerrados')) {
        estadoRuta = {};
        [['hechos', 'hecho'], ['subsanar', 'subsanar'], ['cerrados', 'cerrado'], ['curso', 'curso']].forEach(function (t) {
            (q.get(t[0]) || '').split(',').map(clave).filter(Boolean).forEach(function (v) { estadoRuta[v] = t[1]; });
        });
        // &visitas=363:SUB-00042,371:SUB-00045
        (q.get('visitas') || '').split(',').forEach(function (par) {
            var i = par.lastIndexOf(':');
            if (i > 0) visitaRuta[clave(par.slice(0, i))] = par.slice(i + 1).trim();
        });
    }
    $('btn-completo').href = 'index.html' + location.search; // el mapa completo también entiende ?lote= y ?mr=
    if (q.get('c')) activas = q.get('c').split(',').filter(function (c) { return IDX.cuadrillas[c]; });
    plegarBarra(movil.matches || plegada); // en el celular la hoja arranca cerrada
    // Al abrir no se encuadran todas las cuadrillas guardadas (alejaba el mapa a todo el valle); solo si vienen en el enlace (?c=)
    mostrarCuadrillas(!!q.get('c') && !q.get('lote') && !q.get('mr'));
    capasActivas.forEach(function (k) { mostrarCapa(k, true); });
    // ?ll=6.2751,-75.5737: ubica el lote que contiene el punto
    var llUrl = q.get('ll') && window.leerCoordenadas(q.get('ll'));
    if (llUrl) ubicarPunto(llUrl);
    // ?q=CR 38 # 91 83 (desde pqr.html): se busca como si se hubiera escrito en el buscador
    else if (q.get('q')) { $('buscar').value = q.get('q'); buscar(); }
    else if (q.get('lote') || q.get('mr')) {
        var lista = (q.get('lote') || q.get('mr')).split(',');
        $('buscar').value = lista.join(', ');
        ir(lista, true);
    }
})();
</script>
