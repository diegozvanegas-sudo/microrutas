<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mapa</title>
    <link rel="stylesheet" href="css/leaflet.css">
    <style>
    :root { --brand: #167a55; --brand-dark: #0f6847; --ink: #1f2937; --muted: #64748b; --line: #dce4e8; --surface: #ffffff; --bg: #f3f6f5; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
    #barra { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 12px 6px; display: grid; gap: 6px; box-shadow: 0 2px 10px rgba(15, 45, 35, .08); z-index: 1001; }
    .fila { display: flex; gap: 6px; align-items: center; min-width: 0; }
    .fila input { flex: 1; min-width: 0; min-height: 38px; border: 1px solid #b8c6cd; border-radius: 9px; padding: 6px 10px; font: inherit; color: var(--ink); background: #fff; }
    button, .boton { font: inherit; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer; font-weight: 650; text-decoration: none; white-space: nowrap; display: inline-block; }
    .primario { color: #fff; background: var(--brand); }
    .primario:hover { background: var(--brand-dark); }
    .secundario { color: var(--brand); background: #edf8f3; }
    .chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; font-size: 13px; }
    .chip .punto { width: 10px; height: 10px; border-radius: 50%; }
    .chip[aria-pressed="true"] { border-color: var(--brand); background: #e3f4ec; box-shadow: inset 0 0 0 1px var(--brand); }
    .chip.cargando { opacity: .6; }
    .chip.capa { border-style: dashed; color: var(--muted); }
    .chip.capa[aria-pressed="true"] { border-style: solid; color: var(--ink); }
    .chip.filtro { font-weight: 500; }
    .chip.filtro[aria-pressed="true"] { border-color: #0369a1; background: #e0f2fe; box-shadow: inset 0 0 0 1px #0369a1; }
    .separador { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
    /* Computador: los botones bajan a otra fila en vez de salirse de la pantalla; el filtro de rutas va en su propia fila */
    @media (min-width: 761px) { .chips { flex-wrap: wrap; overflow-x: visible; row-gap: 6px; } }
    .salto { flex-basis: 100%; height: 0; }
    .grupo, .grupo-cuerpo, .fila-quitar { display: contents; }
    .chip.quitar-todo { color: #b91c1c; border-color: #fca5a5; }
    .chip.quitar-todo:disabled { color: var(--muted); border-color: var(--line); opacity: .55; cursor: default; }
    .sec { display: none; }
    .et-grupo { flex: none; align-self: center; font-size: 12px; font-weight: 650; color: var(--muted); margin-right: 2px; }
    #estado { font-size: 12px; color: var(--muted); min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #map { flex: 1; min-height: 0; }
    /* Solo el mapa (botón ⛶ de la esquina): sin barra ni el botón de capas del celular */
    body.solo-mapa #barra, body.solo-mapa #btn-capas, body.solo-mapa #hoja-capas { display: none !important; }
    .solo-mapa-ctl a { font-size: 18px; line-height: 30px; text-align: center; font-weight: 700; }
    body.solo-mapa .solo-mapa-ctl a { background: var(--brand); color: #fff; }
    @media (max-width: 760px) { .solo-mapa-ctl a { width: 40px !important; height: 40px !important; line-height: 40px !important; font-size: 21px; } }
    .leaflet-bar a { color: var(--ink); }
    .ubicar a, .herramientas a { font-size: 17px; line-height: 30px; text-align: center; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.35; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 3px 0; vertical-align: top; }
    .parada-num { background: var(--brand); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 28px !important; height: 28px !important; margin: -14px 0 0 -14px !important;
                  display: grid; place-items: center; font-weight: 700; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
    /* Pre-ruta: revisados en verde, pendientes en rojo, cerrados en gris */
    .parada-num.pendiente { background: #dc2626; }
    /* Pasó el plazo de visita (3 días desde la ejecución) y sigue sin revisar: fucsia, con su número */
    .parada-num.vencido { background: #c026d3; box-shadow: 0 0 0 3px rgba(192, 38, 211, .35), 0 2px 6px rgba(0, 0, 0, .4); }
    /* Direcciones de un mensaje (?puntos=, desde 📍 Ubicar direcciones): cuadro morado con su número, distinto de los círculos de los lotes */
    .dir-num { background: #7c3aed; color: #fff; border: 2px solid #fff; border-radius: 8px 8px 8px 2px; min-width: 30px; width: auto !important; height: 28px !important;
        padding: 0 6px; display: flex; align-items: center; justify-content: center; font: 700 13px/1 system-ui, sans-serif; white-space: nowrap; box-shadow: 0 1px 5px rgba(0,0,0,.5); }
    .parada-num.hecho { background: #16a34a; }
    .parada-num.cerrado { background: #64748b; font-size: 12px; }
    .parada-num.subsanar { background: #ea580c; }
    .parada-num.curso { background: #2563eb; font-size: 11px; }
    .ruta-estado.curso { color: #1e40af; background: #dbeafe; }
    .ruta-estado.subsanar { color: #9a3412; background: #ffedd5; }
    .ficha-lote .acciones a.subsanar-btn { color: #fff; background: #15803d; }
    .ficha-lote .acciones a.subsanar-btn:hover { color: #fff; background: #166534; }
    #leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 600; }
    #leyenda span { display: inline-flex; align-items: center; gap: 5px; }
    #leyenda i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
    .ficha-lote .ruta-estado { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .ruta-estado.pendiente { color: #b91c1c; background: #fee2e2; }
    .ruta-estado.hecho { color: #15803d; background: #dcfce7; }
    .ruta-estado.cerrado { color: #334155; background: #e2e8f0; }
    .ficha-lote .linea-estado { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; }
    .ficha-lote .linea-estado .ruta-estado { margin-top: 0; }
    /* Leaflet pinta de azul los enlaces del mapa: se fija el color del botón */
    .ficha-lote a.ver-visita { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none;
                               color: #fff; background: var(--brand); }
    .ficha-lote a.ver-visita:hover { color: #fff; background: var(--brand-dark); }
    .ficha-lote .visita-det { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: #f2fbf7; border-left: 3px solid var(--brand); }
    .ficha-lote .visita-det .datos { margin: 0 0 8px; }
    .ficha-lote .visita-det .dato { background: #fff; }
    .ficha-lote .chip-no { display: inline-block; margin: 3px 4px 0 0; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: #b91c1c; background: #fee2e2; }
    .ficha-lote .visita-det .copia { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .ficha-lote .visita-det a.editar-visita { display: block; text-align: center; margin-top: 8px; padding: 9px; color: var(--brand); background: #fff; border: 1px solid #9fd3bd; }
    /* Sentinel-2: cuadro de fecha y nubes, solo visible con ese fondo elegido */
    .s2-panel { background: var(--surface); border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 10px 12px; width: 230px; max-width: calc(100vw - 80px);
        font-size: 12.5px; line-height: 1.35; color: var(--ink); }
    .s2-panel[hidden] { display: none; }
    .s2-panel b { display: block; font-size: 13.5px; margin-bottom: 6px; }
    .s2-panel label { display: block; margin: 6px 0 2px; font-weight: 600; }
    .s2-panel input, .s2-panel select { width: 100%; box-sizing: border-box; min-height: 36px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .s2-panel .s2-sub { color: var(--muted); margin: 6px 0 0; }
    .s2-panel .s2-err { color: #b91c1c; margin: 6px 0 0; }
    .s2-panel .s2-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .s2-panel button { min-height: 36px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: inherit; cursor: pointer; }
    .s2-panel button.s2-ok { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .s2-panel button:disabled { opacity: .6; cursor: wait; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 2000; display: none; max-width: calc(100% - 32px); }
    /* Ficha del lote: ventana en computador, panel desde abajo en el celular */
    .ficha-lote { font-size: 14px; line-height: 1.35; color: var(--ink); }
    .ficha-lote .cab { display: flex; align-items: center; gap: 8px; padding-right: 26px; }
    .ficha-lote .titulo { font-size: 22px; font-weight: 800; }
    .ficha-lote .nota-lote { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #edf8f3; text-decoration: none; font-size: 18px; flex: none; }
    .ficha-lote .cuad { color: #fff; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .ficha-lote .mr { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .ficha-lote .aviso-aprox { margin-top: 8px; padding: 7px 10px; border: 1px dashed #111827; border-radius: 8px; background: #fef9c3; color: #713f12; font-size: 13px; }
    .ficha-lote .datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 10px 0; }
    .ficha-lote .dato { background: var(--bg); border-radius: 8px; padding: 6px 9px; min-width: 0; }
    .ficha-lote .et { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .ficha-lote .dato b { font-size: 14px; overflow-wrap: anywhere; }
    .ficha-lote .bloque { margin: 0 0 10px; }
    .ficha-lote .desc { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .ficha-lote .desc.abierta { display: block; }
    .ficha-lote .mas { color: var(--brand); font-size: 12px; font-weight: 700; cursor: pointer; }
    /* "Este sector": lo que se ve en el polígono tocado, arriba y resaltado */
    .ficha-lote .sector { background: #edf8f3; border-left: 4px solid var(--brand); border-radius: 8px; padding: 8px 10px; }
    .ficha-lote .sector .et { color: var(--brand); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ficha-lote .sector .txt { font-weight: 600; overflow-wrap: anywhere; }
    .ficha-lote .copiar { border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .ficha-lote .desc.plegada { -webkit-line-clamp: 1; line-clamp: 1; color: var(--muted); }
    /* Acciones: dos columnas parejas; Waze y Street View más pequeños en un solo renglón */
    .ficha-lote .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .ficha-lote .acciones .boton { text-align: center; padding: 11px 10px; font-size: 14.5px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .ficha-lote .acciones .subs, .ficha-lote .acciones .ancho, .ficha-lote .acciones .acc-otras { grid-column: 1 / -1; }
    .ficha-lote .acc-otras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ficha-lote .acc-otras .boton { padding: 7px 8px; font-size: 13px; min-height: 36px; font-weight: 600; }
    /* Estado del lote: un renglón por quién lo dice (contratista / interventoría) */
    .ficha-lote .estado-f { display: grid; gap: 6px; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--line); }
    .ficha-lote .fila-est { display: grid; gap: 4px; }
    .ficha-lote .et-est { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .ficha-lote .estado-f .linea-estado { margin-top: 0; gap: 5px 6px; }
    .ficha-lote .fila-est + .fila-est { border-top: 1px dashed var(--line); padding-top: 6px; }
    /* Avisos: lo que hay que atender (pendientes con su plazo, descuentos, requerimientos, PQR) */
    .ficha-lote .avisos-f { display: grid; gap: 6px; margin-top: 8px; }
    .ficha-lote .aviso-f { border-radius: 10px; padding: 8px 10px; border-left: 4px solid #94a3b8; background: #f8fafc; font-size: 13px; }
    .ficha-lote .aviso-f.mal { border-left-color: #dc2626; background: #fef2f2; }
    .ficha-lote .aviso-f.ojo { border-left-color: #d97706; background: #fffbeb; }
    .ficha-lote .aviso-f.bien { border-left-color: #16a34a; background: #f0fdf4; }
    .ficha-lote .aviso-f.info { border-left-color: #2563eb; background: #eff6ff; }
    .ficha-lote .aviso-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; }
    .ficha-lote .plazo-f { font-weight: 800; font-size: 12px; }
    .ficha-lote .aviso-f.mal .plazo-f { color: #b91c1c; }
    .ficha-lote .aviso-f.ojo .plazo-f { color: #b45309; }
    .ficha-lote .aviso-f.bien .plazo-f { color: #15803d; }
    .ficha-lote .aviso-f ul, .ficha-lote .lista-f { margin: 4px 0 6px; padding-left: 18px; display: grid; gap: 2px; }
    .ficha-lote .lista-f { list-style: none; padding-left: 0; }
    .ficha-lote .aviso-f a.ver-visita { padding: 3px 10px; font-size: 11.5px; }
    .ficha-lote .sub-f { color: var(--muted); font-size: 12px; font-weight: 400; }
    .ficha-lote .dato-sub { display: block; font-size: 11.5px; color: #b45309; font-weight: 600; margin-top: 1px; }
    /* Historial y análisis (plegado) */
    .ficha-lote .mas-f { margin: 4px 0 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
    .ficha-lote .mas-f summary { cursor: pointer; font-weight: 700; font-size: 13.5px; min-height: 30px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .ficha-lote .mas-bloque { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .ficha-lote .punto-f { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #94a3b8; vertical-align: middle; }
    .ficha-lote .punto-f.mal { background: #dc2626; }
    .ficha-lote .punto-f.bien { background: #16a34a; }
    .ficha-lote .punto-f.prop { background: #0d9488; }
    .ficha-lote a.enlace-f { color: var(--brand); font-weight: 700; font-size: 12px; text-decoration: none; margin-left: 4px; }
    .ficha-lote .datos { margin: 8px 0 10px; }
    /* Leaflet pinta de azul todos los enlaces del mapa: se fuerzan los colores de los botones */
    .ficha-lote .acciones a.primario { color: #fff; background: var(--brand); }
    .ficha-lote .acciones a.primario:hover { color: #fff; background: var(--brand-dark); }
    .ficha-lote .acciones a.secundario { color: var(--brand); background: #edf8f3; }
    .ficha-lote .acciones a.secundario:hover { color: var(--brand-dark); background: #dcf1e7; }
    .leaflet-popup-content .ficha-lote { min-width: 250px; }
    /* La X de Leaflet (24 px gris claro) casi no se ve ni se atina: círculo grande como el del panel del celular */
    .leaflet-container a.leaflet-popup-close-button { top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--bg);
        color: var(--ink); font: 600 24px/34px system-ui, sans-serif; z-index: 2; }
    .leaflet-container a.leaflet-popup-close-button:hover { background: #dfe6ea; color: var(--ink); }
    .leaflet-popup-content .ficha-lote .cab { padding-right: 76px; }
    /* ⤢ Ampliar la ventana del lote: al lado de la X, con el mismo estilo */
    .ampliar-ficha { position: absolute; top: 8px; right: 48px; z-index: 2; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
        background: var(--bg); color: var(--ink); font: 600 18px/34px system-ui, sans-serif; text-align: center; cursor: pointer; }
    .ampliar-ficha:hover { background: #dfe6ea; }
    .leaflet-popup.grande .ficha-lote { min-width: 380px; }
    /* La ventana se arrastra por el título para ver el lote que tapa; ya movida, la punta no señala nada */
    .leaflet-popup-content .ficha-lote .cab { cursor: move; touch-action: none; user-select: none; }
    .leaflet-popup.movida .leaflet-popup-tip-container { display: none; }
    .leaflet-popup.movida .leaflet-popup-content-wrapper { box-shadow: 0 8px 28px rgba(0, 0, 0, .35); }
    .leaflet-popup.arrastrando { opacity: .9; }
    .leaflet-popup.arrastrando .leaflet-popup-content .ficha-lote .cab { cursor: grabbing; }
    #ficha .ampliar-ficha { top: 12px; right: 50px; width: 32px; height: 32px; line-height: 32px; color: var(--muted); }
    #ficha .ficha-lote .cab { padding-right: 76px; }
    #ficha.grande { max-height: calc(100dvh - 24px); }
    #ficha { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1002; background: var(--surface); border-radius: 16px 16px 0 0;
             box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); padding: 6px 16px calc(16px + env(safe-area-inset-bottom));
             max-height: 55vh; overflow-y: auto; transform: translateY(105%); transition: transform .22s ease; }
    #ficha.abierta { transform: none; }
    #ficha .asa { width: 40px; height: 5px; border-radius: 3px; background: #cbd5db; margin: 2px auto 10px; }
    #ficha .cerrar { position: absolute; top: 12px; right: 10px; background: var(--bg); color: var(--muted); width: 32px; height: 32px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 32px; }
    #btn-plegar, #btn-completo .ico, #btn-capas, #hoja-capas { display: none; }
    .hoja-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .hoja-cab b { font-size: 17px; }
    #hoja-capas .asa { width: 40px; height: 5px; border-radius: 3px; background: #cbd5db; margin: 2px auto 10px; }
    @media (max-width: 760px) {
        #barra { padding: 6px 8px 5px; gap: 5px; }
        .fila input { font-size: 16px; min-height: 36px; }
        .fila .boton, .fila button { padding: 8px 10px; }
        /* Celular: la barra se pliega a solo el buscador para dejarle el espacio al mapa */
        /* Celular: las cuadrillas y capas van en una hoja que sube desde abajo (a mano del pulgar); arriba solo el buscador */
        #btn-capas { display: inline-flex; align-items: center; gap: 6px; position: fixed; left: 12px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 1001;
                     padding: 13px 18px; border-radius: 999px; font-size: 15px; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); max-width: calc(100% - 24px); }
        body.con-ficha #btn-capas, body.con-sel #btn-capas, body:not(.barra-plegada) #btn-capas { display: none; }
        #hoja-capas { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1002; background: var(--surface); border-radius: 16px 16px 0 0;
                      box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); padding: 6px 14px calc(16px + env(safe-area-inset-bottom)); max-height: 72vh; overflow-y: auto;
                      transform: translateY(105%); transition: transform .22s ease; }
        body:not(.barra-plegada) #hoja-capas { transform: none; }
        /* Se desliza por la barrita o el título: arriba (72vh), abajo (deja ver el mapa) o, más abajo, se cierra */
        #hoja-capas.baja { max-height: 34vh; }
        #hoja-capas.arrastrando { transition: none; }
        #hoja-capas .asa { width: 48px; height: 6px; margin: 4px auto 12px; box-shadow: 0 0 0 14px transparent; }
        #hoja-capas .asa, #hoja-capas .hoja-cab { touch-action: none; cursor: grab; }
        #hoja-capas .chips { display: block; overflow: visible; padding: 0; }
        #hoja-capas .grupo { display: block; border-top: 1px solid var(--line); }
        #hoja-capas .grupo:first-child, #hoja-capas .fila-quitar + .grupo { border-top: 0; }

    /* 🔵 Usted está aquí (tocar el punto azul): un renglón por dato, cada uno con su botón de copiar */

    /* ⭐ Operaciones especiales de la programación: estrella en un círculo del color de su estado; punteada = aproximada */
    .esp-pin span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }

    .esp-lista li { min-width: 0; }
    .esp-lista button { box-sizing: border-box; white-space: normal; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .esp-lista i { flex: none; width: 12px; height: 12px; border-radius: 50%; }

    .ficha-lote .acciones button:disabled[data-esp-gps] { opacity: .5; }

                 box-shadow: 0 4px 18px rgba(0, 0, 0, .3); padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #sel-barra .txt { flex: 1 1 160px; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }

    #sel-barra button:disabled { opacity: .5; cursor: default; }
    .chip.modo[aria-pressed="true"] { border-color: #7c3aed; background: #f3e8ff; box-shadow: inset 0 0 0 1px #7c3aed; }
    .ficha-lote .ruta-estado.vencido { color: #b91c1c; background: #fee2e2; }
    .ficha-lote .ruta-estado.pronto { color: #92400e; background: #fef3c7; }

    .halo-lote { animation: halo-lote 1.4s ease-in-out infinite; }

    <div class="fila">

<!-- Datos de la ficha del lote (pendientes, reportes, descuentos, auditoría, requerimientos, PQR y propuesta): src/mapa -->
<script type="module" src="/src/mapa/main.js"></script>
<script>
(function () {
    var IDX = window.indiceRapido || { cuadrillas: {}, lotes: {}, mrs: {}, capas: {} };
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, Math.max(3500, msg.length * 60)); }
    function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function leer(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }

    // ---------- Mapa (canvas: dibuja miles de polígonos mucho más rápido en el celular) ----------
    var map = L.map('map', { preferCanvas: true, zoomControl: false, maxZoom: 21 }).setView([6.271116, -75.569759], 15); // arranca en el centro-norte de Medellín, no en todo el valle
    L.control.zoom({ position: 'topleft' }).addTo(map);
    // Google reparte los cuadros en mt0..mt3: pedirlos a los cuatro carga más rápido
    var satelite = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { subdomains: '0123', maxZoom: 21, maxNativeZoom: 20, attribution: 'Imágenes © Google' });
    // Híbrido: la misma foto de Google con nombres de calles y barrios encima
    var hibrido = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains: '0123', maxZoom: 21, maxNativeZoom: 20, attribution: 'Imágenes © Google' });
    // Esri (Maxar): otra fecha y otros colores; en Medellín solo llega hasta el zoom 19, más cerca se estira
    var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 19, attribution: 'Imágenes © Esri, Maxar' });
    var calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19, attribution: '© OpenStreetMap' });
    // Ortofoto oficial de la Alcaldía (agosto 2025): los lotes se dibujaron sobre ella, así que cuadran con andenes y separadores.
    // Google se ve corrido unos metros en Medellín por la inclinación de sus fotos.
    var orto = L.tileLayer('https://www.medellin.gov.co/servidormapas/rest/services/ServiciosCiudad/IMAGEN_WEBM_2024/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 21, attribution: 'Ortofoto © Alcaldía de Medellín' });
    // Servicio sin año: la ortofoto vigente de la Alcaldía, cambia sola cuando publiquen una nueva.
    var alcaldia = L.tileLayer('https://www.medellin.gov.co/servidormapas/rest/services/ServiciosCiudad/IMAGEN_WEBM/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 21, attribution: 'Ortofoto © Alcaldía de Medellín' });
    // Sentinel-2 (Copernicus Data Space, gratis): la foto más reciente hasta el día elegido, con tope de nubes. Pasa cada ~5 días,
    // pero cada punto mide 10 m: se ven manchas verdes y obras, no el detalle de un lote.
    // Código de la configuración de la interventoría (lo pidió el usuario en el código para no pegarlo en cada equipo).
    // Es público en el repositorio y gasta el cupo gratis de esa cuenta: si alguien lo abusa, se borra la configuración en
    // Copernicus, se crea otra y se cambia aquí. Un código pegado en el equipo («Cambiar código») tiene prioridad.
    var S2_DEFECTO = { id: '377dd911-8793-4832-9713-8b0ca5a529ac', capa: 'TRUE_COLOR', nubes: 30 };
    var S2 = 'rapido_sentinel', s2cfg = leer(S2, null) || { id: S2_DEFECTO.id, capa: S2_DEFECTO.capa, nubes: S2_DEFECTO.nubes };
    function hoyISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    function menosDias(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); }
    var s2fecha = hoyISO();
    var sentinel = L.tileLayer.wms('https://sh.dataspace.copernicus.eu/ogc/wms/' + (s2cfg ? s2cfg.id : 'sin-codigo'), {
        layers: s2cfg ? s2cfg.capa : 'TRUE_COLOR', format: 'image/jpeg', version: '1.3.0', tileSize: 512, // cuadros grandes: la mitad de pedidos al cupo
        maxcc: s2cfg && s2cfg.nubes != null ? s2cfg.nubes : 30, time: menosDias(s2fecha, 90) + '/' + s2fecha, priority: 'mostRecent', showlogo: false,
        maxZoom: 21, attribution: 'Sentinel-2 © Copernicus (ESA)'
    });
    sentinel.on('tileerror', function () { if (s2cfg && !s2Aviso) { s2Aviso = true; s2Error('Copernicus no devolvió la imagen. Revise el código, la conexión o si se acabó el cupo gratis del mes.'); } });
    var s2Aviso = false;
    var bases = { orto: orto, alcaldia: alcaldia, satelite: satelite, hibrido: hibrido, esri: esri, calles: calles, sentinel: sentinel };
    var fondoIni = leer('rapido_fondo', 'orto');
    if (fondoIni === 'sentinel' && !s2cfg) fondoIni = 'orto';
    (bases[fondoIni] || orto).addTo(map);
    L.control.layers({ 'Ortofoto Medellín 2025': orto, 'Ortofoto Alcaldía (vigente)': alcaldia, 'Satélite Google': satelite, 'Google con nombres de calles': hibrido, 'Satélite Esri': esri, 'Calles': calles, 'Sentinel-2 por fecha (10 m)': sentinel }, null, { position: 'topright' }).addTo(map);
    map.on('baselayerchange', function (e) {
        guardar('rapido_fondo', Object.keys(bases).filter(function (k) { return bases[k] === e.layer; })[0] || 'orto');
        s2Mostrar(e.layer === sentinel);
    });

    // Cuadro de Sentinel-2: pide el código la primera vez; después, el día y el tope de nubes
    var s2div;
    var S2Panel = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function () {
            s2div = L.DomUtil.create('div', 's2-panel');
            s2div.hidden = true;
            L.DomEvent.disableClickPropagation(s2div); L.DomEvent.disableScrollPropagation(s2div);
            return s2div;
        }
    });
    map.addControl(new S2Panel());
    function s2Error(msg) { var p = s2div && s2div.querySelector('.s2-err'); if (p) { p.textContent = msg; p.hidden = false; } }
    function s2Pintar() {
        if (!s2cfg) {
            s2div.innerHTML = '<b>🛰 Sentinel-2</b>' +
                '<div>Pegue el código (Instance ID) de su configuración en Copernicus Data Space. Se guarda solo en este equipo.</div>' +
                '<label for="s2-id">Código</label><input id="s2-id" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">' +
                '<p class="s2-err" hidden></p>' +
                '<div class="s2-acc"><button type="button" data-s2="ver-orto">Usar ortofoto</button><button type="button" class="s2-ok" data-s2="guardar">Guardar</button></div>';
            return;
        }
        var n = s2cfg.nubes != null ? s2cfg.nubes : 30;
        s2div.innerHTML = '<b>🛰 Sentinel-2</b>' +
            '<label for="s2-fecha">Foto más reciente hasta el</label><input type="date" id="s2-fecha" max="' + hoyISO() + '" value="' + s2fecha + '">' +
            '<label for="s2-nubes">Nubes máximo</label><select id="s2-nubes">' + [10, 30, 60, 100].map(function (v) {
                return '<option value="' + v + '"' + (v === n ? ' selected' : '') + '>' + (v === 100 ? 'Sin tope (puede salir nublado)' : v + ' %') + '</option>'; }).join('') + '</select>' +
            '<p class="s2-sub">Busca en los 90 días anteriores. Cada punto mide 10 m: sirve para ver cambios grandes, no un lote.</p>' +
            '<p class="s2-err" hidden></p>' +
            '<div class="s2-acc"><button type="button" data-s2="cambiar">Cambiar código</button></div>';
    }
    function s2Mostrar(si) {
        if (!s2div) return;
        s2div.hidden = !si;
        if (si) { s2Aviso = false; s2Pintar(); }
    }
    function s2Aplicar() {
        s2Aviso = false;
        sentinel.setParams({ time: menosDias(s2fecha, 90) + '/' + s2fecha, maxcc: s2cfg.nubes != null ? s2cfg.nubes : 30 });
    }
    // Revisa el código con Copernicus y busca el nombre de la capa de color real de esa configuración
    function s2Guardar() {
        var inp = $('s2-id'), id = (inp.value || '').trim().toLowerCase(), btn = s2div.querySelector('[data-s2="guardar"]');
        if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id))
            return s2Error('Ese código no tiene la forma de un Instance ID (8-4-4-4-12 letras y números). Cópielo completo de «Configuraciones» en Copernicus.');
        btn.disabled = true; btn.textContent = 'Revisando…';
        fetch('https://sh.dataspace.copernicus.eu/ogc/wms/' + id + '?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0').then(function (r) {
            return r.text().then(function (t) { return { ok: r.ok, t: t }; });
        }).then(function (res) {
            var xml = new DOMParser().parseFromString(res.t, 'text/xml');
            if (!res.ok) {
                var ex = xml.getElementsByTagName('ServiceException')[0];
                throw new Error(/invalid instance/i.test(ex ? ex.textContent : '') ? 'Copernicus no reconoce ese código. Revise que sea el de la configuración y no el de la cuenta.' : 'Copernicus respondió con un error (' + (ex ? ex.textContent.trim() : 'sin detalle') + ').');
            }
            var nombres = [].map.call(xml.querySelectorAll('Layer > Layer > Name'), function (e) { return e.textContent.trim(); }).filter(Boolean);
            if (!nombres.length) throw new Error('La configuración no tiene capas. En Copernicus créela con la plantilla de Sentinel-2 L2A.');
            var capa = nombres.filter(function (c) { return /TRUE.?COLOR/i.test(c); })[0] || nombres.filter(function (c) { return /NATURAL/i.test(c); })[0] || nombres[0];
            s2cfg = { id: id, capa: capa, nubes: 30 }; guardar(S2, s2cfg);
            sentinel.setUrl('https://sh.dataspace.copernicus.eu/ogc/wms/' + id, true);
            sentinel.setParams({ layers: capa }, true);
            s2Aplicar(); sentinel.redraw();
            s2Pintar(); toast('Sentinel-2 listo (capa ' + capa + ').');
        }).catch(function (e) {
            btn.disabled = false; btn.textContent = 'Guardar';
            s2Error(e && e.message && !/fetch/i.test(e.message) ? e.message : 'No se pudo contactar a Copernicus. Revise la conexión a internet e intente de nuevo.');
        });

                        var hasta = Math.min(capas.length, i + 25);
                        for (; i < hasta; i++) {
                            var c = capas[i], r = P.analizar(polysDe(c), datos.lotes, datos.bienes);
                            if (r.m2Dudoso < 100) continue;
                            var id = idPoligono(c);
                            if (!hallados[id]) hallados[id] = { id: id, capa: c, m2: 0, total: 0, cbmls: [] };
                            hallados[id].m2 += r.m2Dudoso; hallados[id].total += r.total;
                            r.dudosos.forEach(function (d) { if (hallados[id].cbmls.indexOf(d.cbml) === -1) hallados[id].cbmls.push(d.cbml); });
                            L.polygon(c.getLatLngs(), ESTILO_MARCADO).addTo(capaPredios);
                            dibujarDudosos(r, datos);
                        }
                        $('estado').textContent = 'Revisando ' + i + ' de ' + capas.length + ' polígonos…';
                        if (i < capas.length) setTimeout(tanda, 0); else fin({ hallados: hallados, incompleto: datos.incompleto });
                    })();
                });
            });
        }).then(function (res) {
            if (!res) return;
            halladosPrivados = Object.keys(res.hallados).map(function (k) { return res.hallados[k]; }).sort(function (a, b) { return b.m2 - a.m2; });
            if (movil.matches) plegarBarra(true);
            abrirPanel('<div class="ficha-lote"><div class="cab"><span class="titulo">🔎 Posibles privados</span></div>' +
                '<div class="mr">' + capas.length + ' polígonos revisados en lo que se ve · ' + halladosPrivados.length + ' con 100 m² o más sobre predios que no figuran como del municipio</div>' +
                (halladosPrivados.length ? '<div class="pred-lista">' + halladosPrivados.map(function (h, j) {
                    var l = h.capa.lote;
                    return '<button type="button" class="boton secundario" data-privado-ir="' + j + '">' + esc(tituloPoligono(l, true)) + ' · ' + m2(h.m2) +
                        '<span class="sub">' + Math.round(100 * h.m2 / (h.total || 1)) + ' % del polígono · CBML ' + esc(h.cbmls.join(', ')) + '</span></button>';
                }).join('') + '</div>' : '<div class="pred-nota">✓ Ningún lote a la vista cae de forma importante sobre predios no municipales.</div>') +
                '<div class="pred-nota">En el mapa: naranja = lote a revisar; rojo punteado = predio que no figura como del municipio. Es un indicio para pedir que se evalúe, no una prueba. Tocar el mapa borra las marcas.' +
                (res.incompleto ? '<br>⚠ El catastro no entregó todos los predios de la zona: acérquese más y repita.' : '') + '</div></div>', map.getCenter(), true);
        }).catch(avisoCatastro).then(function () { if (turno === turnoRevision) pintarChips(); });
    }

    document.addEventListener('click', function (ev) {
        if (!ev.target.closest) return;
        var b = ev.target.closest('[data-predio-revisar]');
        if (b) return revisarLote(b);
        var cb = ev.target.closest('[data-predio-cbml]');
        if (cb) { map.closePopup(); cerrarFicha(); $('buscar').value = cb.dataset.predioCbml; return buscarCbml(cb.dataset.predioCbml); }
        var cp = ev.target.closest('[data-predio-copiar]');
        if (cp) {
            var t = cp.dataset.predioCopiar, listo = function () { toast('Copiado: péguelo en el reporte'); };
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(listo, function () { copiarViejo(t) && listo(); });
            if (copiarViejo(t)) listo();
            return;
        }
        var pl = ev.target.closest('[data-predio-lote]');
        if (pl) { var t2 = lotesCbml[+pl.dataset.predioLote]; if (t2) { map.closePopup(); resaltarMr(t2.capa.lote.m); verLote(t2.capa); } return; }
        var pv = ev.target.closest('[data-privado-ir]');
        if (pv) { var h = halladosPrivados[+pv.dataset.privadoIr]; if (h) { map.closePopup(); resaltarMr(h.capa.lote.m); verLote(h.capa); } return; }
        var af = ev.target.closest('[data-area-filtro]');
        if (af) { var kv = af.dataset.areaFiltro.split(':'); filtroAreas[kv[0]] = kv[0] === 'mias' ? kv[1] === 'true' : kv[1]; return verAreas(); }
        var ai = ev.target.closest('[data-area-ir]');
        if (ai) { var a = areasVistas[+ai.dataset.areaIr]; if (a) { map.closePopup(); cerrarFicha(); estadoRuta = null; $('buscar').value = a.l || a.m; ir([a.l || a.m], true); } }
    }, true);
    pintarBuscador();
    pintarControlPrivados();
    if (predPref.areas) cargarAreas().catch(function () {});

    // ---------- Solo el mapa: se esconde la barra (buscador, cuadrillas y capas) y el mapa ocupa toda la pantalla ----------
    // El botón ⛶ / ☰ queda siempre en la esquina del mapa (debajo del de fondos); Esc también vuelve. Se recuerda en el equipo.
    var soloMapa = leer('rapido_solo_mapa', false), btnSolo;
    function ponerSoloMapa(on) {
        var arriba = map.getContainer().getBoundingClientRect().top;
        soloMapa = on;
        guardar('rapido_solo_mapa', on);
        document.body.classList.toggle('solo-mapa', on);
        if (btnSolo) {
            btnSolo.textContent = on ? '☰' : '⛶';
            btnSolo.title = on ? 'Mostrar la barra (buscador, cuadrillas y capas)' : 'Solo el mapa: esconder la barra';
            btnSolo.setAttribute('aria-label', btnSolo.title);
            btnSolo.setAttribute('aria-pressed', String(on));
        }
        map.invalidateSize({ pan: false });
        // Lo que se ve queda en el mismo sitio aunque el borde de arriba del mapa se movió
        var corrido = map.getContainer().getBoundingClientRect().top - arriba;
        if (corrido) map.panBy([0, corrido], { animate: false });
    }
    var SoloMapa = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function () {
            var caja = L.DomUtil.create('div', 'leaflet-bar solo-mapa-ctl');
            btnSolo = L.DomUtil.create('a', '', caja);
            btnSolo.href = '#'; btnSolo.setAttribute('role', 'button');
            L.DomEvent.disableClickPropagation(caja);
            L.DomEvent.on(btnSolo, 'click', function (ev) { L.DomEvent.preventDefault(ev); ponerSoloMapa(!soloMapa); });
            return caja;
        }
    });
    map.addControl(new SoloMapa());
    ponerSoloMapa(soloMapa);
    document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Escape' || !soloMapa) return;
        if (document.querySelector('dialog[open]') || map._popup && map.hasLayer(map._popup)) return; // Esc cierra primero lo abierto
        ponerSoloMapa(false);
    });

    // ---------- Inicio ----------
    // mapa_rapido.html?lote=532,371  ·  ?mr=Z2CC0308  ·  ?c=2,7 (cuadrillas)  ·  ?q=dirección o lo que se escribe en el buscador
    // Desde la pre-ruta: ?lote=532,371,363&hechos=371&cerrados=363 (los demás quedan como pendientes)
    var q = new URLSearchParams(location.search);
    if (q.has('hechos') || q.has('cerrados')) {
        estadoRuta = {};
        // &vencidos=: sin visita y con el plazo de 3 días ya pasado (los calcula la pre-ruta de Subsanaciones)
        [['vencidos', 'vencido'], ['hechos', 'hecho'], ['subsanar', 'subsanar'], ['cerrados', 'cerrado'], ['curso', 'curso']].forEach(function (t) {
            (q.get(t[0]) || '').split(',').map(clave).filter(Boolean).forEach(function (v) { estadoRuta[v] = t[1]; });
        });
        // &visitas=363:SUB-00042,371:SUB-00045
        (q.get('visitas') || '').split(',').forEach(function (par) {
            var i = par.lastIndexOf(':');
            if (i > 0) visitaRuta[clave(par.slice(0, i))] = par.slice(i + 1).trim();
        });
    }
    $('btn-completo').href = 'index.html' + location.search; // el mapa completo también entiende ?lote= y ?mr=
    if (q.get('c')) activas = q.get('c').split(',').filter(function (c) { return IDX.cuadrillas[c]; });
    plegarBarra(movil.matches || plegada); // en el celular la hoja arranca cerrada
    // Al abrir no se encuadran todas las cuadrillas guardadas (alejaba el mapa a todo el valle); solo si vienen en el enlace (?c=)
    mostrarCuadrillas(!!q.get('c') && !q.get('lote') && !q.get('mr'));
    capasActivas.forEach(function (k) { mostrarCapa(k, true); });
    // ?guia=llantas&dia=1 (desde cronogramas.html): prende esa guía, para ese día (sin día: hoy) y la encuadra
    var guiaUrl = q.get('guia');
    guiaPref.on = guiaPref.on.filter(function (id) { return guias.some(function (g) { return g.id === id; }); });
    if (guiaUrl) {
        if (!guias.length) toast('La guía no está en este equipo: abra Cronogramas con su sesión y vuelva a intentarlo.');
        else {
            if (guiaUrl !== '1' && guias.some(function (g) { return g.id === guiaUrl; }) && guiaPref.on.indexOf(guiaUrl) === -1) guiaPref.on.push(guiaUrl);
            if (guiaUrl === '1' && !guiaPref.on.length) guiaPref.on = guias.map(function (g) { return g.id; });
            guiaPref.dia = q.has('dia') && /^[0-6]$/.test(q.get('dia')) ? +q.get('dia') : null;
            guiaPref.hoy = q.has('dia');
            guardar('rapido_guia', guiaPref);
        }
    } else if (guiaPref.dia != null) { guiaPref.dia = null; guardar('rapido_guia', guiaPref); }   // el día elegido vale solo para ese enlace
    if (guias.length) { pintarGuia(!!guiaUrl && !q.get('lote') && !q.get('mr')); pintarChips(); }
    // ⭐ Especiales prendidos la última vez (y solo si sigue habiendo programación con especiales)
    if (espOn && especiales().length) { pintarEspeciales(); ubicarEspeciales(); }
    // ?puntos=…: las direcciones de un mensaje, numeradas (solas o junto con ?lote=)
    if (q.get('puntos') && pintarPuntosUrl(q.get('puntos')) && !q.get('lote') && !q.get('mr')) map.fitBounds(cajaPuntosUrl().pad(0.3), { maxZoom: 18 });
    // ?ll=6.2751,-75.5737: ubica el lote que contiene el punto
    var llUrl = q.get('ll') && window.leerCoordenadas(q.get('ll'));
    if (llUrl) ubicarPunto(llUrl);
    // ?q=CR 38 # 91 83 (desde pqr.html): se busca como si se hubiera escrito en el buscador
    else if (q.get('q')) { $('buscar').value = q.get('q'); buscar(); }
    else if (q.get('lote') || q.get('mr')) {
        var lista = (q.get('lote') || q.get('mr')).split(',');
        $('buscar').value = lista.join(', ');
        ir(lista, true, q.get('abrir'));
    }
})();
</script>
