# Publica la página (carpeta web/) en GitHub Pages cada vez que se sube un cambio a main.
# Es una copia del sitio de Netlify: misma base de Supabase, mismos usuarios.
# Usa los mismos secretos de "Mantener Supabase activo": SUPABASE_URL y SUPABASE_ANON_KEY.
# Activar una vez: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para publicar a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test # si una prueba falla no se publica
      # Sirve como secreto o como variable, con nombre SUPABASE_... o VITE_SUPABASE_...
      - name: Construir
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan SUPABASE_URL y/o SUPABASE_ANON_KEY en Settings → Secrets and variables → Actions"
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: despliegue
        uses: actions/deploy-pages@v4
